<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEON AI | Hyper-Core v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #020617;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .typing-cursor::after {
            content: ' ';
            display: inline-block;
            width: 8px;
            height: 18px;
            background: #3b82f6;
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .bg-glow {
            position: absolute;
            width: 60vw;
            height: 60vw;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
            transition: all 3s ease-in-out;
        }
        .prose pre {
            background: #0f172a;
            padding: 1.25rem;
            border-radius: 1rem;
            overflow-x: auto;
            border: 1px solid rgba(59, 130, 246, 0.2);
            margin: 1rem 0;
        }
        .prose code {
            font-family: 'JetBrains Mono', monospace;
            color: #cbd5e1;
            background: rgba(255,255,255,0.05);
            padding: 0.2rem 0.4rem;
            border-radius: 0.3rem;
        }
        .prose p { margin-bottom: 1rem; line-height: 1.6; }
        .prose ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .prose strong { color: #60a5fa; font-weight: 600; }
        .transition-all-custom { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- Utils ---
        const generateId = () => Math.random().toString(36).substr(2, 9);

        function App() {
            // --- State ---
            const [sidebarOpen, setSidebarOpen] = useState(true);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [models, setModels] = useState([]);
            const [currentChatId, setCurrentChatId] = useState(null);
            const [chats, setChats] = useState(() => {
                const saved = localStorage.getItem('neon_ai_v5_chats');
                return saved ? JSON.parse(saved) : {};
            });
            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('neon_ai_v5_settings');
                return saved ? JSON.parse(saved) : {
                    model: 'gemma4:31b-cloud',
                    temperature: 0.6,
                    top_p: 0.9,
                    top_k: 40,
                    systemPrompt: 'You are NEON AI v5.0, a hyper-intelligent, concise, and helpful local assistant. Use markdown for formatting. Be professional, technical when needed, and extremely efficient. Always prioritize clarity.',
                    theme: 'dark'
                };
            });
            const [input, setInput] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const messagesEndRef = useRef(null);

            // --- Persistence ---
            useEffect(() => {
                localStorage.setItem('neon_ai_v5_chats', JSON.stringify(chats));
            }, [chats]);

            useEffect(() => {
                localStorage.setItem('neon_ai_v5_settings', JSON.stringify(settings));
            }, [settings]);

            // --- Initialization ---
            useEffect(() => {
                fetchModels();
                if (Object.keys(chats).length === 0) {
                    createNewChat();
                } else {
                    setCurrentChatId(Object.keys(chats)[0]);
                }
            }, []);

            const fetchModels = async () => {
                try {
                    const response = await fetch('/models');
                    const data = await response.json();
                    if (data.models) {
                        setModels(data.models);
                    }
                } catch (e) {
                    console.error("Failed to fetch models", e);
                }
            };

            const scrollToBottom = () => {
                messagesEndRef.current?.scrollIntoView({ behavior: "smooth" });
            };

            useEffect(() => { scrollToBottom(); }, [chats, currentChatId]);

            // --- Chat Logic ---
            const createNewChat = () => {
                const id = generateId();
                setChats(prev => ({
                    ...prev,
                    [id]: {
                        id,
                        title: `New Session ${Object.keys(prev).length + 1}`,
                        messages: [],
                        createdAt: Date.now()
                    }
                }));
                setCurrentChatId(id);
            };

            const deleteChat = (id, e) => {
                e.stopPropagation();
                const newChats = { ...chats };
                delete newChats[id];
                setChats(newChats);
                if (currentChatId === id) {
                    const remainingIds = Object.keys(newChats);
                    setCurrentChatId(remainingIds.length > 0 ? remainingIds[0] : null);
                }
            };

            const handleSend = async () => {
                if (!input.trim() || !currentChatId) return;

                const userText = input;
                setInput('');
                setIsLoading(true);

                const currentChat = chats[currentChatId];
                const userMsg = { role: 'user', content: userText, timestamp: Date.now() };

                // Update UI immediately with user message
                const updatedMessages = [...currentChat.messages, userMsg];
                setChats(prev => ({
                    ...prev,
                    [currentChatId]: {
                        ...prev[currentChatId],
                        messages: updatedMessages,
                        title: updatedMessages[0].content.slice(0, 30) + (updatedMessages[0].content.length > 30 ? '...' : '')
                    }
                }));

                try {
                    const response = await fetch('/chat/stream', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            model: settings.model,
                            messages: updatedMessages.map(m => ({ role: m.role, content: m.content })),
                            system_prompt: settings.systemPrompt,
                            options: {
                                temperature: settings.temperature,
                                top_p: settings.top_p,
                                top_k: settings.top_k
                            }
                        })
                    });

                    if (!response.ok) throw new Error("Network response was not ok");

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let aiContent = "";

                    // Create an AI message entry
                    const aiMsgId = Date.now();
                    setChats(prev => ({
                        ...prev,
                        [currentChatId]: {
                            ...prev[currentChatId],
                            messages: [...updatedMessages, { role: 'ai', content: '', timestamp: aiMsgId }]
                        }
                    }));

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n\n');

                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                const dataStr = line.slice(6);
                                if (dataStr === '[DONE]') break;
                                try {
                                    const data = JSON.parse(dataStr);
                                    if (data.content) {
                                        aiContent += data.content;
                                        // Update AI message content in real-time
                                        setChats(prev => {
                                            const chat = prev[currentChatId];
                                            const msgs = [...chat.messages];
                                            msgs[msgs.length - 1].content = aiContent;
                                            return { ...prev, [currentChatId]: { ...chat, messages: msgs } };
                                        });
                                    }
                                } catch (e) {
                                    console.error("JSON parse error in stream", e);
                                }
                            }
                        }
                    }
                } catch (error) {
                    console.error("Chat error", error);
                    setChats(prev => {
                        const chat = prev[currentChatId];
                        return {
                            ...prev,
                            [currentChatId]: {
                                ...chat,
                                messages: [...currentChat.messages, { role: 'ai', content: 'CRITICAL ERROR: Neural link severed.', timestamp: Date.now() }]
                            }
                        };
                    });
                } finally {
                    setIsLoading(false);
                }
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                // Simple alert for "Toast"
                alert("Copied to neural clipboard!");
            };

            const activeChat = chats[currentChatId];

            return (
                <div className="h-screen w-full flex relative overflow-hidden bg-[#020617] text-slate-200">
                    <div className="bg-glow bg-blue-600 top-[-10%] left-[-10%]"></div>
                    <div className="bg-glow bg-purple-600 bottom-[-10%] right-[-10%]"></div>

                    {/* --- Sidebar (Left) --- */}
                    <div className={`h-full glass-panel transition-all-custom flex flex-col z-20 ${sidebarOpen ? 'w-72' : 'w-16'}`}>
                        <div className="p-4 flex items-center justify-between border-b border-white/10">
                            {sidebarOpen && (
                                <h2 className="font-bold tracking-tight text-white">HISTORY</h2>
                            )}
                            <button
                                onClick={() => setSidebarOpen(!sidebarOpen)}
                                className="p-2 hover:bg-white/10 rounded-lg transition-colors"
                            >
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                </svg>
                            </button>
                        </div>

                        {sidebarOpen && (
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
                                <button
                                    onClick={createNewChat}
                                    className="w-full p-3 mb-4 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold transition-all flex items-center justify-center gap-2 shadow-lg shadow-blue-500/20"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                                    </svg>
                                    New Chat
                                </button>

                                {Object.values(chats).sort((a, b) => b.createdAt - a.createdAt).map(chat => (
                                    <div
                                        key={chat.id}
                                        onClick={() => setCurrentChatId(chat.id)}
                                        className={`group p-3 rounded-xl cursor-pointer transition-all flex items-center justify-between ${currentChatId === chat.id ? 'bg-blue-600/20 border border-blue-500/30 text-white' : 'hover:bg-white/5 border border-transparent text-slate-400'}`}
                                    >
                                        <div className="flex items-center gap-3 truncate">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
                                            </svg>
                                            <span className="truncate text-sm">{chat.title}</span>
                                        </div>
                                        <button
                                            onClick={(e) => deleteChat(chat.id, e)}
                                            className="opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 transition-all"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                            </svg>
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>

                    {/* --- Main Chat Area --- */}
                    <div className="flex-1 flex flex-col relative overflow-hidden z-10">
                        <header className="h-16 border-b border-white/10 flex items-center justify-between px-6 bg-white/5 backdrop-blur-md">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center shadow-lg">
                                    <span className="text-white font-bold">N</span>
                                </div>
                                <h1 className="text-lg font-bold tracking-tight text-white">
                                    NEON <span className="text-blue-400">AI</span> <span className="text-xs font-normal text-slate-500 ml-2">v5.0 Hyper-Core</span>
                                </h1>
                            </div>

                            <div className="flex items-center gap-3">
                                <div className="relative group">
                                    <select
                                        value={settings.model}
                                        onChange={(e) => setSettings({...settings, model: e.target.value})}
                                        className="bg-slate-900 border border-white/10 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500 appearance-none pr-8 cursor-pointer hover:bg-slate-800 transition-colors"
                                    >
                                        {models.map(m => (
                                            <option key={m.name} value={m.name}>{m.name}</option>
                                        ))}
                                    </select>
                                    <div className="absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none">
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                                        </svg>
                                    </div>
                                </div>
                                <button
                                    onClick={() => setSettingsOpen(!settingsOpen)}
                                    className={`p-2 rounded-lg transition-all ${settingsOpen ? 'bg-blue-600 text-white' : 'hover:bg-white/10 text-slate-400'}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.626 2.37 2.07A1.724 1.724 0 0016.35 6.31c1.756-.426 1.756-2.924 0-3.35a1.724 1.724 0 00-1.066-2.573c.94-1.543-.626-3.31-2.07-2.37a1.724 1.724 0 00-1.066 2.573c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.626-2.37-2.07a1.724 1.724 0 00-1.066 2.573c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573 1.066c-1.543-.94-3.31.626-2.37 2.07A1.724 1.724 0 003.65 6.31c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.626-3.31 2.07-2.37a1.724 1.724 0 001.066 2.573c.426 1.756 2.924 1.756 3.35 0z" />
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                                    </svg>
                                </button>
                            </div>
                        </header>

                        <div className="flex-1 flex relative overflow-hidden">
                            {/* Chat Thread */}
                            <div className="flex-1 overflow-y-auto custom-scrollbar p-4 md:p-8 space-y-8">
                                {!activeChat || activeChat.messages.length === 0 ? (
                                    <div className="h-full flex flex-col items-center justify-center text-center p-6">
                                        <div className="p-12 bg-white/5 rounded-[40px] border border-white/10 backdrop-blur-sm max-w-lg relative overflow-hidden group">
                                            <h2 className="text-4xl font-bold mb-4 text-white tracking-tight">Neural Link <span className="text-blue-400">Active</span></h2>
                                            <p className="text-slate-400 mono text-sm leading-relaxed">v5.0 Core engaged. Ready for high-fidelity processing. Select a model and start your session.</p>
                                        </div>
                                    </div>
                                ) : (
                                    activeChat.messages.map((msg, i) => (
                                        <div key={i} className={`flex ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[85%] md:max-w-[75%] p-5 rounded-2xl shadow-sm transition-all ${
                                                msg.role === 'user'
                                                ? 'bg-blue-600 text-white rounded-tr-none'
                                                : 'bg-slate-900/70 text-slate-200 rounded-tl-none border border-white/10 glass-panel'
                                            }`}>
                                                <div className="flex items-center justify-between mb-3 opacity-50 text-[10px] mono uppercase tracking-widest">
                                                    <span>{msg.role === 'user' ? 'User_Auth' : 'Neural_Core'}</span>
                                                    {msg.role === 'ai' && (
                                                        <button
                                                            onClick={() => copyToClipboard(msg.content)}
                                                            className="hover:text-white transition-colors flex items-center gap-1"
                                                        >
                                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                                            </svg>
                                                            Copy
                                                        </button>
                                                    )}
                                                </div>
                                                <div className="text-sm leading-relaxed prose prose-invert max-w-none">
                                                    <div dangerouslySetInnerHTML={{ __html: marked.parse(msg.content) }} />
                                                </div>
                                            </div>
                                        </div>
                                    ))
                                )}
                                {isLoading && (
                                    <div className="flex justify-start">
                                        <div className="bg-slate-900/70 p-5 rounded-2xl rounded-tl-none border border-white/10 glass-panel">
                                            <div className="flex gap-1.5">
                                                <div className="w-1.5 h-1.5 bg-blue-400 rounded-full animate-bounce"></div>
                                                <div className="w-1.5 h-1.5 bg-purple-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
                                                <div className="w-1.5 h-1.5 bg-pink-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <div ref={messagesEndRef} />
                            </div>

                            {/* Settings Panel (Right) */}
                            {settingsOpen && (
                                <div className="w-80 glass-panel border-l border-white/10 h-full overflow-y-auto custom-scrollbar p-6 z-30 transition-all animate-in slide-in-from-right">
                                    <div className="flex items-center justify-between mb-8">
                                        <h3 className="text-lg font-bold text-white">Neural Tuning</h3>
                                        <button onClick={() => setSettingsOpen(false)} className="text-slate-500 hover:text-white">
                                            <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                            </svg>
                                        </button>
                                    </div>

                                    <div className="space-y-8">
                                        {/* Temp Slider */}
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center">
                                                <label className="text-xs mono text-slate-400 uppercase">Temperature</label>
                                                <span className="text-xs mono text-blue-400">{settings.temperature}</span>
                                            </div>
                                            <input
                                                type="range" min="0" max="1" step="0.1"
                                                value={settings.temperature}
                                                onChange={(e) => setSettings({...settings, temperature: parseFloat(e.target.value)})}
                                                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                            />
                                        </div>

                                        {/* Top-P Slider */}
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center">
                                                <label className="text-xs mono text-slate-400 uppercase">Top-P</label>
                                                <span className="text-xs mono text-blue-400">{settings.top_p}</span>
                                            </div>
                                            <input
                                                type="range" min="0" max="1" step="0.05"
                                                value={settings.top_p}
                                                onChange={(e) => setSettings({...settings, top_p: parseFloat(e.target.value)})}
                                                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                            />
                                        </div>

                                        {/* Top-K Slider */}
                                        <div className="space-y-4">
                                            <div className="flex justify-between items-center">
                                                <label className="text-xs mono text-slate-400 uppercase">Top-K</label>
                                                <span className="text-xs mono text-blue-400">{settings.top_k}</span>
                                            </div>
                                            <input
                                                type="range" min="1" max="100" step="1"
                                                value={settings.top_k}
                                                onChange={(e) => setSettings({...settings, top_k: parseInt(e.target.value)})}
                                                className="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
                                            />
                                        </div>

                                        {/* System Prompt */}
                                        <div className="space-y-4">
                                            <label className="text-xs mono text-slate-400 uppercase">System Identity</label>
                                            <textarea
                                                value={settings.systemPrompt}
                                                onChange={(e) => setSettings({...settings, systemPrompt: e.target.value})}
                                                className="w-full h-32 p-3 bg-slate-950 border border-white/10 rounded-xl text-xs mono focus:outline-none focus:ring-1 focus:ring-blue-500 transition-all resize-none"
                                            />
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>

                        {/* Input Area */}
                        <div className="p-6 bg-white/5 border-t border-white/10 backdrop-blur-md">
                            <div className="relative flex items-end gap-3 max-w-4xl mx-auto">
                                <textarea
                                    value={input}
                                    onChange={(e) => setInput(e.target.value)}
                                    onKeyDown={(e) => {
                                        if (e.key === 'Enter' && !e.shiftKey) {
                                            e.preventDefault();
                                            handleSend();
                                        }
                                    }}
                                    placeholder="Enter neural command..."
                                    rows="1"
                                    className="relative flex-1 p-4 bg-slate-950 border border-white/10 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all text-white placeholder-gray-600 mono text-sm resize-none overflow-hidden"
                                    style={{ height: 'auto', maxHeight: '200px' }}
                                    onInput={(e) => {
                                        e.target.style.height = 'auto';
                                        e.target.style.height = e.target.scrollHeight + 'px';
                                    }}
                                />
                                <button
                                    onClick={handleSend}
                                    disabled={isLoading}
                                    className="p-4 bg-blue-600 hover:bg-blue-500 text-white rounded-2xl shadow-lg transition-all disabled:opacity-50 active:scale-95 shrink-0"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
